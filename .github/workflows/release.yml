---
name: Release
on:
  push:
    branches:
      - release
jobs:
  terraform-release:
    name: "terraform:release"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v8
        with:
          branches: |
            [
              'release'
            ]
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
